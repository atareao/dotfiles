# Nevi Language Configuration
# Configure per-language settings like formatters and tab width.
# If no formatter is specified, :Format and format-on-save fall back to LSP.
#
# Placeholder: {file} - replaced with the full file path
#
# Example configurations are commented out below.
# Uncomment and modify to enable.

# ============================================================================
# TYPESCRIPT / JAVASCRIPT (Biome - fast Rust-native formatter)
# ============================================================================
# [typescript]
# formatter = { command = "biome", args = ["format", "--stdin-file-path", "{file}"] }
# tab_width = 2
#
# [javascript]
# formatter = { command = "biome", args = ["format", "--stdin-file-path", "{file}"] }
# tab_width = 2
#
# [tsx]
# formatter = { command = "biome", args = ["format", "--stdin-file-path", "{file}"] }
# tab_width = 2
#
# [jsx]
# formatter = { command = "biome", args = ["format", "--stdin-file-path", "{file}"] }
# tab_width = 2

# ============================================================================
# TYPESCRIPT / JAVASCRIPT (Oxfmt - fastest, ~2x faster than Biome)
# Install: npm install -g oxfmt
# ============================================================================
# [typescript]
# formatter = { command = "oxfmt", args = ["--stdin-filepath={file}"] }
# tab_width = 2
#
# [javascript]
# formatter = { command = "oxfmt", args = ["--stdin-filepath={file}"] }
# tab_width = 2
#
# [tsx]
# formatter = { command = "oxfmt", args = ["--stdin-filepath={file}"] }
# tab_width = 2
#
# [jsx]
# formatter = { command = "oxfmt", args = ["--stdin-filepath={file}"] }
# tab_width = 2

# ============================================================================
# TYPESCRIPT / JAVASCRIPT (Prettier - if you prefer)
# ============================================================================
# [typescript]
# formatter = { command = "prettier", args = ["--stdin-filepath", "{file}"] }
# tab_width = 2
#
# [javascript]
# formatter = { command = "prettier", args = ["--stdin-filepath", "{file}"] }
# tab_width = 2

# ============================================================================
# PYTHON (Black formatter)
# ============================================================================
# [python]
# formatter = { command = "black", args = ["-", "--stdin-filename", "{file}"] }
# tab_width = 4

# ============================================================================
# CSS / SCSS (Oxfmt)
# ============================================================================
# [css]
# formatter = { command = "oxfmt", args = ["--stdin-filepath={file}"] }
# tab_width = 2
#
# [scss]
# formatter = { command = "oxfmt", args = ["--stdin-filepath={file}"] }
# tab_width = 2

# ============================================================================
# CSS / SCSS (Prettier)
# ============================================================================
# [css]
# formatter = { command = "prettier", args = ["--stdin-filepath", "{file}"] }
# tab_width = 2
#
# [scss]
# formatter = { command = "prettier", args = ["--stdin-filepath", "{file}"] }
# tab_width = 2

# ============================================================================
# JSON (Oxfmt)
# ============================================================================
# [json]
# formatter = { command = "oxfmt", args = ["--stdin-filepath={file}"] }
# tab_width = 2

# ============================================================================
# JSON (Prettier)
# ============================================================================
# [json]
# formatter = { command = "prettier", args = ["--stdin-filepath", "{file}"] }
# tab_width = 2

# ============================================================================
# RUST (uses rust-analyzer LSP by default - no external formatter needed)
# ============================================================================
# [rust]
# tab_width = 4

# ============================================================================
# GO
# ============================================================================
# [go]
# formatter = { command = "gofmt", args = [] }
# tab_width = 4

# ============================================================================
# RUBY (RuboCop autocorrect)
# ruby-lsp formats via LSP by default; set this to format with RuboCop directly.
# --fail-level fatal keeps exit 0 on style offenses (Nevi treats a nonzero
# exit as failure) while still failing on unparseable code.
# ============================================================================
# [ruby]
# formatter = { command = "rubocop", args = ["--stdin", "{file}", "-a", "--stderr", "--format", "quiet", "--fail-level", "fatal"] }
# tab_width = 2

# ============================================================================
# SHELL (shfmt)
# Install: go install mvdan.cc/sh/v3/cmd/shfmt@latest
# ============================================================================
# [shell]
# formatter = { command = "shfmt", args = ["-filename", "{file}", "-"] }
# tab_width = 2
