GOOSE_TELEMETRY_ENABLED: true
extensions:
  chatrecall:
    enabled: false
    type: platform
    name: chatrecall
    description: Search past conversations and load session summaries for contextual memory
    display_name: Chat Recall
    bundled: true
    available_tools: []
  summarize:
    enabled: false
    type: platform
    name: summarize
    description: Load files/directories and get an LLM summary in a single call
    display_name: Summarize
    bundled: true
    available_tools: []
  developer:
    enabled: true
    type: platform
    name: developer
    description: Write and edit files, and execute shell commands
    display_name: Developer
    bundled: true
    available_tools: []
  skills:
    enabled: false
    type: platform
    name: skills
    description: Discover and provide skill instructions from filesystem and builtins
    display_name: Skills
    bundled: true
    available_tools: []
  todo:
    enabled: true
    type: platform
    name: todo
    description: Enable a todo list for goose so it can keep track of what it is doing
    display_name: Todo
    bundled: true
    available_tools: []
  tom:
    enabled: false
    type: platform
    name: tom
    description: Inject custom context into every turn via GOOSE_MOIM_MESSAGE_TEXT and GOOSE_MOIM_MESSAGE_FILE environment variables
    display_name: Top Of Mind
    bundled: true
    available_tools: []
  analyze:
    enabled: false
    type: platform
    name: analyze
    description: 'Analyze code structure with tree-sitter: directory overviews, file details, symbol call graphs'
    display_name: Analyze
    bundled: true
    available_tools: []
  extensionmanager:
    enabled: true
    type: platform
    name: Extension Manager
    description: Enable extension management tools for discovering, enabling, and disabling extensions
    display_name: Extension Manager
    bundled: true
    available_tools: []
  apps:
    enabled: false
    type: platform
    name: apps
    description: Create and manage custom Goose apps through chat. Apps are HTML/CSS/JavaScript and run in sandboxed windows.
    display_name: Apps
    bundled: true
    available_tools: []
  summon:
    enabled: false
    type: platform
    name: summon
    description: Load knowledge and delegate tasks to subagents
    display_name: Summon
    bundled: true
    available_tools: []
  code_execution:
    enabled: false
    type: platform
    name: code_execution
    description: Goose will make extension calls through code execution, saving tokens
    display_name: Code Mode
    bundled: true
    available_tools: []
  orchestrator:
    enabled: false
    type: platform
    name: orchestrator
    description: 'Manage agent sessions: list, view, start, send messages, interrupt, and stop agents'
    display_name: Orchestrator
    bundled: true
    available_tools: []
  computercontroller:
    enabled: false
    type: builtin
    name: computercontroller
    description: General computer control tools that don't require you to be a developer or engineer.
    display_name: Computer Controller
    timeout: 300
    bundled: true
    available_tools: []
  autovisualiser:
    enabled: false
    type: builtin
    name: autovisualiser
    description: Data visualization and UI generation tools
    display_name: Auto Visualiser
    timeout: 300
    bundled: true
    available_tools: []
  memory:
    enabled: true
    type: builtin
    name: memory
    description: Teach goose your preferences as you go.
    display_name: Memory
    timeout: 300
    bundled: true
    available_tools: []
  tutorial:
    enabled: false
    type: builtin
    name: tutorial
    description: Access interactive tutorials and guides
    display_name: Tutorial
    timeout: 300
    bundled: true
    available_tools: []
  mcp-searxng:
    enabled: false
    type: streamable_http
    name: mcp-searxng
    description: A tool to search in internet
    uri: http://localhost:3005/mcp
    envs: {}
    env_keys: []
    headers: {}
    timeout: 300
    socket: null
    bundled: null
    available_tools: []
slash_commands:
  - command: "dev"
    recipe_path: "/home/lorenzo/.config/goose/recipes/desarrollo.yaml"
  - command: "escribe"
    recipe_path: "/home/lorenzo/.config/goose/recipes/escritura.yaml"
  - command: "minimo"
    recipe_path: "/home/lorenzo/.config/goose/recipes/minimo.yaml"
  - command: "ayuda"
    recipe_path: "/home/lorenzo/.config/goose/recipes/ayuda.yaml"
OLLAMA_HOST: localhost
OLLAMA_TIMEOUT: '600'
providers:
  local:
    enabled: true
    model: bartowski/Llama-3.2-1B-Instruct-GGUF:Q4_K_M
    configured: true
  openrouter:
    enabled: true
    model: deepseek/deepseek-v4-flash
    configured: true
  ollama:
    enabled: true
    model: gemma4:12b
    configured: true
active_provider: openrouter
GOOSE_THINKING_EFFORT: low
OPENROUTER_HOST: https://openrouter.ai
GOOSE_MODE: auto
GOOSE_SHELL: fish
