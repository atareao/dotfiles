# Language support configuration.
# See the languages documentation: https://docs.helix-editor.com/master/languages.html

# --- MARKDOWN ---
[[language]]
name = "markdown"
auto-format = true
text-width = 80             # Helps map soft wrapping or line indicators
soft-wrap.enable = true     # Essential for reading long prose naturally

# --- RUST ---
[[language]]
name = "rust"
auto-format = true

[language-server.rust-analyzer.config]
checkOnSave = { command = "clippy" } # Use clippy instead of cargo check
inlayHints = { typeHints.enable = true, parameterHints.enable = true, chainingHints.enable = true }

# --- TYPESCRIPT / JAVASCRIPT ---
[[language]]
name = "typescript"
auto-format = true

[language-server.typescript-language-server.config.typescript.inlayHints]
includeInlayParameterNameHints = "all"
includeInlayVariableTypeHints = true
includeInlayFunctionLikeReturnTypeHints = true

# --- PYTHON ---
# Helix natively supports ruff and pyright. Ruff is lightning fast for linting/formatting.
[[language]]
name = "python"
auto-format = true
language-servers = [ "ruff", "pyright" ]
